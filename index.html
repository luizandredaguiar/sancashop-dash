      <div className="bg-slate-800 border border-slate-600 rounded-lg p-3 shadow-xl text-sm">
        <p className="text-slate-300 font-medium mb-2">{label}</p>
        {payload.map((entry, i) => (
          <p key={i} style={{ color: entry.color }}>
            {entry.name}: {entry.name.includes('Ticket') ? `R$ ${Number(entry.value).toFixed(2)}` : entry.name.includes('aturamento') ? formatR$(entry.value) : entry.value?.toLocaleString('pt-BR')}
          </p>
        ))}
      </div>
    );
  };

  // ============================================================================
  // MAIN APP
  // ============================================================================
  const App = () => {
    const [sortCol, setSortCol] = useState('fat2026');
    const [sortDir, setSortDir] = useState('desc');
    const [chartStore, setChartStore] = useState('');
    const [activeTab, setActiveTab] = useState('yoy');
    const [momChartStore, setMomChartStore] = useState('');
    const [momSortCol, setMomSortCol] = useState('fatAbr26');
    const [momSortDir, setMomSortDir] = useState('desc');
    const [dailyStore, setDailyStore] = useState('');
    const [dailySortCol, setDailySortCol] = useState('fatDU26');
    const [dailySortDir, setDailySortDir] = useState('desc');
    const [trendStore, setTrendStore] = useState('__all__');
    const [clientStore, setClientStore] = useState('__all__');

    const SA = window.STORE_ANALYTICS;
    const sameStores = SA.sameStores || [];

    const YEAR_COLORS = { 2023: '#64748b', 2024: '#3b82f6', 2025: '#8b5cf6', 2026: '#22c55e' };
    const YTD_COLORS = { '2025 YTD': '#c084fc', '2026 YTD': '#4ade80' };

    const computed = useMemo(() => {
      const lastUpdate = DATA.lastUpdate;
      const lastUpdateDate = new Date(lastUpdate + 'T12:00:00');
      const lastUpdateMonth = lastUpdateDate.getMonth() + 1;
      const lastUpdateDay = lastUpdateDate.getDate();
      const months2026 = Object.keys(DATA.stores[Object.keys(DATA.stores)[0]]?.['2026'] || {}).map(Number);
      const maxMonth2026 = Math.max(...months2026);

      const DAYS_IN_MONTH = { 1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30, 7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31 };

      // Month is partial only if last update is in the same month AND not the last day
      const isPartial = (lastUpdateMonth === maxMonth2026) && (lastUpdateDay < DAYS_IN_MONTH[maxMonth2026]);
      const partialMonth = isPartial ? maxMonth2026 : null;

      // monthRange: only FULL months (exclude partial month — MTD handles it separately)
      const monthRange = [];
      const lastFullMonth = partialMonth ? maxMonth2026 - 1 : maxMonth2026;
      for (let m = 1; m <= lastFullMonth; m++) monthRange.push(m);
      const daysElapsed = partialMonth ? lastUpdateDay : null;
      const daysInPartial = partialMonth ? DAYS_IN_MONTH[partialMonth] : null;
      const linearFactor = partialMonth ? (daysInPartial / daysElapsed) : 1;

      // Blend projection: uses same-month-last-year proportion + linear, weighted by day of month
      // Days 1-7: 80% proportional + 20% linear
      // Days 8-15: 50/50
      // Days 16+: 20% proportional + 80% linear
      const computeBlendFactor = (storeName, month, fatPartial, vendasPartial) => {
        if (!partialMonth || month !== partialMonth) return { fatFactor: 1, vendasFactor: 1 };
        const linFactor = daysInPartial / daysElapsed;
        // Try to get proportional factor from daily data
        if (DAILY_DATA && DAILY_DATA.days) {
          const prevYear = 2025;
          const pad = n => String(n).padStart(2, '0');
          let fatPrev = 0, fatPrevTotal = 0, vendasPrev = 0, vendasPrevTotal = 0;
          for (let d = 1; d <= daysInPartial; d++) {
            const dateStr = prevYear + '-' + pad(month) + '-' + pad(d);
            const dayData = DAILY_DATA.days[dateStr];
            if (dayData && dayData[storeName]) {
              if (d <= daysElapsed) { fatPrev += dayData[storeName].fat; vendasPrev += dayData[storeName].vendas; }
              fatPrevTotal += dayData[storeName].fat;
              vendasPrevTotal += dayData[storeName].vendas;
            }
          }
          if (fatPrev > 0 && fatPrevTotal > 0) {
            const propFatFactor = fatPrevTotal / fatPrev;
            const propVendasFactor = vendasPrev > 0 ? vendasPrevTotal / vendasPrev : linFactor;
            // Blend weights based on days elapsed
            const propWeight = daysElapsed <= 7 ? 0.8 : daysElapsed <= 15 ? 0.5 : 0.2;
            const linWeight = 1 - propWeight;
            return {
              fatFactor: propWeight * propFatFactor + linWeight * linFactor,
              vendasFactor: propWeight * propVendasFactor + linWeight * linFactor,
            };
          }
        }
        return { fatFactor: linFactor, vendasFactor: linFactor };
      };
      // Legacy factor for places that don't use per-store blend
      const projectionFactor = linearFactor;

      const periodLabel = monthRange.length === 1 ? MESES[monthRange[0]-1] : MESES[monthRange[0]-1] + '-' + MESES[monthRange[monthRange.length-1]-1];
      const hasProjection = false;

      const stores2026 = Object.keys(DATA.stores).filter(s => s !== 'CD Sancashop');

      const storeRows = stores2026.map(name => {
        const d2026 = DATA.stores[name]?.['2026'] || {};
        let fat2026 = 0, vendas2026 = 0;
        monthRange.forEach(m => {
          if (d2026[m]) {
            if (m === partialMonth) {
              const blend = computeBlendFactor(name, m, d2026[m].valor, d2026[m].vendas);
              fat2026 += d2026[m].valor * blend.fatFactor;
              vendas2026 += Math.round(d2026[m].vendas * blend.vendasFactor);
            } else {
              fat2026 += d2026[m].valor;
              vendas2026 += d2026[m].vendas;
            }
          }
        });
        const ticket2026 = vendas2026 > 0 ? fat2026 / vendas2026 : 0;

        const yearData = {};
        [2023, 2024, 2025].forEach(year => {
          const hStore = HISTORICAL[name];
          if (!hStore) { yearData[year] = null; return; }
          const hYear = hStore[String(year)];
          if (!hYear || Object.keys(hYear).length === 0) { yearData[year] = null; return; }

          let fat = 0, vendas = 0, hasAll = true;
          monthRange.forEach(m => {
            const md = hYear[String(m)];
            if (!md) { hasAll = false; }
            else { fat += md.valor; vendas += (md.vendas || 0); }
          });

          if (!hasAll) { yearData[year] = null; }
          else { yearData[year] = { fat, vendas, ticket: vendas > 0 ? fat / vendas : null }; }
        });

        const fat2025 = yearData[2025]?.fat || null;
        const vendas2025 = yearData[2025]?.vendas || null;
        const varFatYoY = (fat2025 && fat2026) ? ((fat2026 / fat2025) - 1) * 100 : null;
        const varTicketYoY = (yearData[2025]?.ticket && ticket2026) ? ((ticket2026 / yearData[2025].ticket) - 1) * 100 : null;
        const varVendasYoY = (vendas2025 && vendas2026) ? ((vendas2026 / vendas2025) - 1) * 100 : null;

        return {
          name, fat2026, vendas2026, ticket2026,
          fat2023: yearData[2023]?.fat || null,
          fat2024: yearData[2024]?.fat || null,
          fat2025,
          vendas2025,
          ticket2025: yearData[2025]?.ticket || null,
          varYoY: varFatYoY, varTicketYoY, varVendasYoY,
          existsIn: {
            2023: yearData[2023] !== null,
            2024: yearData[2024] !== null,
            2025: yearData[2025] !== null,
          }
        };
      });

      const comparableStores = storeRows.filter(s => s.fat2025 !== null && s.fat2026 > 0);
      const totalFat2026 = comparableStores.reduce((s, r) => s + r.fat2026, 0);
      const totalFat2025 = comparableStores.reduce((s, r) => s + r.fat2025, 0);
      const varTotal = totalFat2025 > 0 ? ((totalFat2026 / totalFat2025) - 1) * 100 : 0;

      const allYearsStores = storeRows.filter(s => s.existsIn[2023] && s.existsIn[2024] && s.existsIn[2025] && s.fat2026 > 0);
      const consolidatedChart = [2023, 2024, 2025].map(year => {
        // Full year: sum ALL months from HISTORICAL for stores present in all 4 years
        const total = allYearsStores.reduce((sum, s) => {
          const hYear = HISTORICAL[s.name]?.[String(year)];
          if (!hYear) return sum;
          let fat = 0;
          Object.values(hYear).forEach(md => { fat += md.valor || 0; });
          return sum + fat;
        }, 0);
        return { ano: String(year), faturamento: total };
      });

      // Consolidated chart: ALL stores that existed in EACH period (including closed ones)
      const consolidatedAllChart = [2023, 2024, 2025].map(year => {
        let total = 0;
        // Sum ALL months from HISTORICAL for ALL stores that had data in this year
        const allHistStores = Object.keys(HISTORICAL);
        allHistStores.forEach(name => {
          const hYear = HISTORICAL[name]?.[String(year)];
          if (!hYear || Object.keys(hYear).length === 0) return;
          Object.values(hYear).forEach(md => { total += md.valor || 0; });
        });
        return { ano: String(year), faturamento: total };
      });

      // Per-store chart data for the dropdown filter (full year totals for historical)
      const storeChartData = (storeName) => {
        const result = [];
        [2023, 2024, 2025].forEach(year => {
          const hYear = HISTORICAL[storeName]?.[String(year)];
          if (hYear && Object.keys(hYear).length > 0) {

            Object.values(hYear).forEach(md => { fat += md.valor || 0; });
            if (fat > 0) result.push({ ano: String(year), faturamento: fat });
          }
        });
        return result;
      };

      // Sorted store names for dropdown
      const storeNames2026 = stores2026.slice().sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // Fat YTD for header
      const fatYTD = Object.keys(DATA.stores).filter(s => s !== 'CD Sancashop').reduce((sum, name) => {
        const yearData = DATA.stores[name]?.['2026'] || {};
        return sum + Object.values(yearData).reduce((s, d) => s + d.valor, 0);
      }, 0);

      // ============================================================================
      // MOM DATA

      const DAYS_IN_MONTH_MAP = DAYS_IN_MONTH;
      const momMonths = monthRange; // same months as YoY (1,2,3)

      const momStoreRows = stores2026.map(name => {

        const hStore = HISTORICAL[name];

        const monthData = {};
        let totalFat26 = 0, totalVendas26 = 0;

        momMonths.forEach(m => {
          const raw2026 = d2026[m];
          if (!raw2026) { monthData[m] = { fat26: 0, fat25: null, fat24: null, fat23: null, var2526: null }; return; }

          let fat26 = raw2026.valor;

          if (m === partialMonth) {

          }

          totalFat26 += fat26;
          totalVendas26 += vendas26;

          const getFat = (year) => {
            if (!hStore || !hStore[String(year)] || !hStore[String(year)][String(m)]) return null;
            return hStore[String(year)][String(m)].valor;

          const fat25 = getFat(2025);
          const fat24 = getFat(2024);
          const fat23 = getFat(2023);
          const var2526 = fat25 ? ((fat26 / fat25) - 1) * 100 : null;

          monthData[m] = { fat26, fat25, fat24, fat23, var2526, vendas26 };
        });

        // Ticket 2026 average across months
        const ticket26 = totalVendas26 > 0 ? totalFat26 / totalVendas26 : 0;

        // Ticket 2025 average (same months)
        let totalFat25ForTicket = 0, totalVendas25ForTicket = 0;
        momMonths.forEach(m => {

        const ticket25 = totalVendas25ForTicket > 0 ? totalFat25ForTicket / totalVendas25ForTicket : null;
        const varTicket2526 = (ticket25 && ticket26) ? ((ticket26 / ticket25) - 1) * 100 : null;

        // Total vendas 2025 for same months
        let totalVendas25 = 0;
        let hasAllVendas25 = true;
        momMonths.forEach(m => {
          if (hStore && hStore['2025'] && hStore['2025'][String(m)] && hStore['2025'][String(m)].vendas) {

        });
        const varVendas2526 = (hasAllVendas25 && totalVendas25 > 0 && totalVendas26 > 0)
          ? ((totalVendas26 / totalVendas25) - 1) * 100 : null;

        return {

      });

      // Merge MTD April data into momStoreRows for sorting
      // (done after computeMTD is available — patched below)

      // MoM grouped bar chart data
      const momChartAllStores = (() => {
        // Stores present in all 4 years for each month
        const storesInAllYears = stores2026.filter(name => {

          }, 0);
          return entry;

      })();

      // MoM consolidated: ALL stores that existed in EACH period (including closed ones)
      const allHistStoreNames = Object.keys(HISTORICAL);
      const momChartConsolidated = momMonths.map(m => {

        [2023, 2024, 2025].forEach(year => {

          if (!raw) return sum;
          if (m === partialMonth) {
            const blend = computeBlendFactor(name, m, raw.valor, raw.vendas);
            return sum + raw.valor * blend.fatFactor;
          }
          return sum + raw.valor;
        }, 0);
        return entry;
      });

      const momChartForStore = (storeName) => {
        const hStore = HISTORICAL[storeName];
        if (!hStore) return [];
        return momMonths.map(m => {
          const entry = { month: MESES[m - 1] };
          [2023, 2024, 2025].forEach(year => {
            entry[String(year)] = hStore?.[String(year)]?.[String(m)]?.valor || 0;
          });
          const raw = DATA.stores[storeName]?.['2026']?.[m];
          if (raw && m === partialMonth) {
            const blend = computeBlendFactor(storeName, m, raw.valor, raw.vendas);
            entry['2026'] = raw.valor * blend.fatFactor;
          } else {
            entry['2026'] = raw ? raw.valor : 0;
          }
          return entry;
        });
      };

      // Count stores present in all years for the "Todas" filter label
      const momAllYearsCount = stores2026.filter(name => {
        const hStore = HISTORICAL[name];
        if (!hStore) return false;
        return momMonths.every(m => {
          return hStore['2023']?.[String(m)]?.valor &&
                 hStore['2024']?.[String(m)]?.valor &&
                 hStore['2025']?.[String(m)]?.valor &&
                 DATA.stores[name]?.['2026']?.[m];
        });
      }).length;

      // MoM KPI cards - March comparable stores
      const lastMonth = momMonths[momMonths.length - 1]; // 3 = March
      const momComparableMarStores = stores2026.filter(name => {
        const hStore = HISTORICAL[name];
        const has25 = hStore?.['2025']?.[String(lastMonth)]?.valor;
        const has26 = DATA.stores[name]?.['2026']?.[lastMonth];
        return has25 && has26;
      });
      const momFatMar26 = momComparableMarStores.reduce((sum, name) => {
        const raw = DATA.stores[name]?.['2026']?.[lastMonth];
        if (!raw) return sum;
        if (lastMonth === partialMonth) {
          const blend = computeBlendFactor(name, lastMonth, raw.valor, raw.vendas);
          return sum + raw.valor * blend.fatFactor;
        }
        return sum + raw.valor;
      }, 0);
      const momFatMar25 = momComparableMarStores.reduce((sum, name) => {
        return sum + (HISTORICAL[name]?.['2025']?.[String(lastMonth)]?.valor || 0);
      }, 0);
      const momVarMar = momFatMar25 > 0 ? ((momFatMar26 / momFatMar25) - 1) * 100 : 0;

      
      // ============================================================================
      // DAILY DATA COMPUTATION
      // ============================================================================
      const dailyComputed = (() => {
        if (!DAILY_DATA || !DAILY_DATA.days) return null;
        const days = DAILY_DATA.days;
        
        // Holiday definitions
        const holidays2025 = {
          '2025-01-01': 'Confraternização Universal',
          '2025-01-20': 'São Sebastião (RJ)',
          '2025-03-01': 'Carnaval (Sáb)',
          '2025-03-02': 'Carnaval (Dom)',
          '2025-03-03': 'Carnaval (Seg)',
          '2025-03-04': 'Carnaval (Terça)',
          '2025-03-05': 'Quarta de Cinzas',
        };
        const holidays2026 = {
          '2026-01-01': 'Confraternização Universal',
          '2026-01-20': 'São Sebastião (RJ)',
          '2026-02-14': 'Carnaval (Sáb)',
          '2026-02-15': 'Carnaval (Dom)',
          '2026-02-16': 'Carnaval (Seg)',
          '2026-02-17': 'Carnaval (Terça)',
          '2026-02-18': 'Quarta de Cinzas',
        };
        const allHolidays = { ...holidays2025, ...holidays2026 };
        
        // Build date arrays dynamically based on available data
        const makeDateRange = (year, endMonth, endDay) => {
          const dates = [];
          const start = new Date(year, 0, 1);
          const end = new Date(year, endMonth - 1, endDay);
          for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            dates.push(d.toISOString().split('T')[0]);
          }
          return dates;
        };
        
        // Find the last date with data in 2026
        const allDates2026 = Object.keys(days).filter(d => d.startsWith('2026-')).sort();
        const lastDate2026 = allDates2026[allDates2026.length - 1] || '2026-03-31';
        const lastParts = lastDate2026.split('-');
        const lastMonth = parseInt(lastParts[1]);
        const lastDay = parseInt(lastParts[2]);
        
        const dates2025 = makeDateRange(2025, lastMonth, lastDay);
        const dates2026 = makeDateRange(2026, lastMonth, lastDay);
        const maxDays = Math.min(dates2025.length, dates2026.length);
        
        // Get all store names present in both years
        const storesInBothYears = new Set();
        const allStores2026 = new Set();
        dates2026.forEach(d => {
          if (days[d]) Object.keys(days[d]).forEach(s => { if (s !== 'CD Sancashop') allStores2026.add(s); });
        });
        allStores2026.forEach(s => {
          // Check if store has at least some 2025 data
          const has2025 = dates2025.some(d => days[d] && days[d][s]);
          if (has2025) storesInBothYears.add(s);
        });
        
        // Build line chart data - indexed by day number (0 to maxDays-1)
        const buildChartData = (storeName) => {
          const chartData = [];
          for (let i = 0; i < maxDays; i++) {
            const d25 = dates2025[i];
            const d26 = dates2026[i];
            const date25 = new Date(d25 + 'T12:00:00');
            const date26 = new Date(d26 + 'T12:00:00');
            
            let fat25 = null, fat26 = null;
            const isSameFilter = storeName === '__same__';
            const sameSet = isSameFilter ? new Set(window.STORE_ANALYTICS?.sameStores || []) : null;
            if (!storeName || storeName === '' || isSameFilter) {
              // Consolidated - sum all stores (or same stores only)
              if (days[d25]) {
                fat25 = 0;
                Object.entries(days[d25]).forEach(([s, v]) => { if (s !== 'CD Sancashop' && (!isSameFilter || sameSet.has(s))) fat25 += v.fat; });
              }
              if (days[d26]) {
                fat26 = 0;
                Object.entries(days[d26]).forEach(([s, v]) => { if (s !== 'CD Sancashop' && (!isSameFilter || sameSet.has(s))) fat26 += v.fat; });
              }
            } else {
              fat25 = days[d25]?.[storeName]?.fat ?? null;
              fat26 = days[d26]?.[storeName]?.fat ?? null;
            }
            
            const dayOfMonth25 = date25.getDate();
            const month25 = date25.getMonth();
            const dayOfMonth26 = date26.getDate();
            const month26 = date26.getMonth();
            const monthNames = ['Jan','Fev','Mar','Abr'];
            
            const weekdays = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
            const pad = n => String(n).padStart(2, '0');
            const labelDate = pad(dayOfMonth26) + '/' + pad(month26 + 1) + '/' + String(date26.getFullYear()).slice(2);
            
            chartData.push({
              dayNum: i + 1,
              label: labelDate,
              date2025: d25,
              date2026: d26,
              weekday2025: weekdays[date25.getDay()],
              weekday2026: weekdays[date26.getDay()],
              fat2025: fat25,
              fat2026: fat26,
              isHoliday25: !!allHolidays[d25],
              isHoliday26: !!allHolidays[d26],
              holidayName25: allHolidays[d25] || null,
              holidayName26: allHolidays[d26] || null,
            });
          }
          return chartData;
        };
        
        // Classify days for metrics
        const classifyDay = (dateStr) => {
          const d = new Date(dateStr + 'T12:00:00');
          const dow = d.getDay(); // 0=Sun, 6=Sat
          const isHol = !!allHolidays[dateStr];
          if (isHol) return 'feriado';
          if (dow === 0 || dow === 6) return 'fds';
          return 'util';
        };
        
        // Summary metrics by month and day type
        const getMonthNum = (dateStr) => parseInt(dateStr.split('-')[1]);
        
        const computeMetrics = (dateList, storeName) => {
          const metrics = {}; // { month: { util: {fat:[], vendas:[], ticket:[]}, fds: {...}, feriado: {...} } }
          dateList.forEach(dateStr => {
            const month = getMonthNum(dateStr);
            const dayType = classifyDay(dateStr);
            if (!metrics[month]) metrics[month] = { util: {fat:[], vendas:[], ticket:[]}, fds: {fat:[], vendas:[], ticket:[]}, feriado: {fat:[], vendas:[], ticket:[]} };
            
            let fat = 0, vendas = 0;
            const isSameFilter = storeName === '__same__';
            const sameSet = isSameFilter ? new Set(window.STORE_ANALYTICS?.sameStores || []) : null;
            if (!storeName || storeName === '' || isSameFilter) {
              if (days[dateStr]) {
                Object.entries(days[dateStr]).forEach(([s, v]) => {
                  if (s !== 'CD Sancashop' && (!isSameFilter || sameSet.has(s))) { fat += v.fat; vendas += v.vendas; }
                });
              }
            } else {
              const sd = days[dateStr]?.[storeName];
              if (sd) { fat = sd.fat; vendas = sd.vendas; }
            }
            
            if (fat > 0) {
              metrics[month][dayType].fat.push(fat);
              metrics[month][dayType].vendas.push(vendas);
              metrics[month][dayType].ticket.push(vendas > 0 ? fat / vendas : 0);
            }
          });
          
          // Compute averages
          const result = {};
          Object.entries(metrics).forEach(([month, types]) => {
            result[month] = {};
            Object.entries(types).forEach(([dtype, arrays]) => {
              const avgFat = arrays.fat.length > 0 ? arrays.fat.reduce((a,b)=>a+b,0) / arrays.fat.length : 0;
              const avgVendas = arrays.vendas.length > 0 ? arrays.vendas.reduce((a,b)=>a+b,0) / arrays.vendas.length : 0;
              const avgTicket = arrays.ticket.length > 0 ? arrays.ticket.reduce((a,b)=>a+b,0) / arrays.ticket.length : 0;
              result[month][dtype] = { avgFat, avgVendas, avgTicket, count: arrays.fat.length };
            });
          });
          return result;
        };
        
        // Per-store table data
        const storeTableRows = Array.from(allStores2026).filter(s => s !== 'CD Sancashop').map(storeName => {
          const m25 = computeMetrics(dates2025.slice(0, maxDays), storeName);
          const m26 = computeMetrics(dates2026, storeName);
          
          // Overall averages across all months
          const avg = (metrics, dtype, field) => {
            let sum = 0, count = 0;
            Object.values(metrics).forEach(m => {
              if (m[dtype] && m[dtype][field] > 0) {
                sum += m[dtype][field] * m[dtype].count;
                count += m[dtype].count;
              }
            });
            return count > 0 ? sum / count : 0;
          };
          
          const fatDU25 = avg(m25, 'util', 'avgFat');
          const fatDU26 = avg(m26, 'util', 'avgFat');
          const fatFDS25 = avg(m25, 'fds', 'avgFat');
          const fatFDS26 = avg(m26, 'fds', 'avgFat');
          const fatFer25 = avg(m25, 'feriado', 'avgFat');
          const fatFer26 = avg(m26, 'feriado', 'avgFat');
          
          return {
            name: storeName,
            fatDU26, varDU: fatDU25 > 0 ? ((fatDU26/fatDU25)-1)*100 : null,
            fatFDS26, varFDS: fatFDS25 > 0 ? ((fatFDS26/fatFDS25)-1)*100 : null,
            fatFer26, varFer: fatFer25 > 0 ? ((fatFer26/fatFer25)-1)*100 : null,
          };
        });
        
        // Holiday reference lines for chart (day numbers where holidays fall)
        const holidayMarkers2026 = [];
        dates2026.forEach((d, i) => {
          if (allHolidays[d]) holidayMarkers2026.push({ dayNum: i+1, label: allHolidays[d] });
        });
        const holidayMarkers2025 = [];
        dates2025.slice(0, maxDays).forEach((d, i) => {
          if (allHolidays[d]) holidayMarkers2025.push({ dayNum: i+1, label: allHolidays[d] });
        });
        
        return {
          buildChartData,
          computeMetrics,
          dates2025: dates2025.slice(0, maxDays),
          dates2026,
          maxDays,
          allHolidays,
          holidays2025,
          holidays2026,
          holidayMarkers2026,
          holidayMarkers2025,
          storeTableRows,
          storeNames: Array.from(allStores2026).filter(s => s !== 'CD Sancashop').sort((a,b) => a.localeCompare(b, 'pt-BR')),
        };
      })();

      // ============================================================================
      // CONSOLIDATED SUMMARY ROWS FOR TABLES
      // ============================================================================
      const buildSummaryRow = (label, stores) => {
        const has23 = stores.some(r => r.fat2023 !== null);
        const fat2023 = has23 ? stores.reduce((s, r) => s + (r.fat2023 || 0), 0) : null;
        const has24 = stores.some(r => r.fat2024 !== null);
        const fat2024 = has24 ? stores.reduce((s, r) => s + (r.fat2024 || 0), 0) : null;
        const has25 = stores.some(r => r.fat2025 !== null);
        const fat2025 = has25 ? stores.reduce((s, r) => s + (r.fat2025 || 0), 0) : null;
        const fat2026 = stores.reduce((s, r) => s + r.fat2026, 0);
        const vendas2026 = stores.reduce((s, r) => s + r.vendas2026, 0);
        const ticket2026 = vendas2026 > 0 ? fat2026 / vendas2026 : 0;
        const varYoY = fat2025 ? ((fat2026 / fat2025) - 1) * 100 : null;
        const vendas2025 = stores.filter(r => r.fat2025 !== null).reduce((s, r) => s + (r.vendas2025 || 0), 0);
        const ticket2025 = vendas2025 > 0 && fat2025 ? fat2025 / vendas2025 : null;
        const varTicketYoY = (ticket2025 && ticket2026) ? ((ticket2026 / ticket2025) - 1) * 100 : null;
        const varVendasYoY = vendas2025 > 0 && vendas2026 > 0 ? ((vendas2026 / vendas2025) - 1) * 100 : null;
        return { name: label, fat2023, fat2024, fat2025, fat2026, varYoY, ticket2026, varTicketYoY, vendas2026, varVendasYoY, _isSummary: true };
      };
      const yoySummaryAll = buildSummaryRow('Consolidado (todas as lojas)', storeRows);
      const yoySummarySame = buildSummaryRow('Mesmas lojas (todos os anos)', allYearsStores);

      // MoM summary rows
      const buildMomSummaryRow = (label, stores) => {
        const monthData = {};
        momMonths.forEach(m => {
          const fat26 = stores.reduce((s, r) => s + (r.monthData[m]?.fat26 || 0), 0);
          const has25 = stores.some(r => r.monthData[m]?.fat25 !== null && r.monthData[m]?.fat25 !== undefined);
          const fat25 = has25 ? stores.reduce((s, r) => s + (r.monthData[m]?.fat25 || 0), 0) : null;
          const var2526 = fat25 ? ((fat26 / fat25) - 1) * 100 : null;
          monthData[m] = { fat26, fat25, var2526 };
        });
        return {
          name: label,
          monthData,
          fatJan26: monthData[1]?.fat26 || 0,
          fatFev26: monthData[2]?.fat26 || 0,
          fatMar26: monthData[3]?.fat26 || 0,
          varJan: monthData[1]?.var2526,
          varFev: monthData[2]?.var2526,
          varMar: monthData[3]?.var2526,
          _isSummary: true,
        };
      };
      const momSummaryAll = buildMomSummaryRow('Consolidado (todas as lojas)', momStoreRows);
      // Same-stores for MoM: stores present in all 4 years for all months
      const momSameStoreNames = stores2026.filter(name => {
        const hStore = HISTORICAL[name];
        if (!hStore) return false;
        return momMonths.every(m =>
          hStore['2023']?.[String(m)]?.valor &&
          hStore['2024']?.[String(m)]?.valor &&
          hStore['2025']?.[String(m)]?.valor &&
          DATA.stores[name]?.['2026']?.[m]
        );
      });
      const momSameStores = momStoreRows.filter(r => momSameStoreNames.includes(r.name));
      const momSummarySame = buildMomSummaryRow('Mesmas lojas (todos os anos)', momSameStores);

      // ============================================================================
      // YTD DATA (Jan 1 to last available date in April)
      // ============================================================================
      const computeYTD = (() => {
        // 2026 YTD: months 1-3 from DATA + month 4 from DATA (actual Apr 1 data)
        // 2025 YTD: months 1-3 from HISTORICAL + April 1 2025 estimated (full April / 30)
        const ytdMonthsFull = [1, 2, 3]; // Full months
        const apr2026HasData = Object.keys(DATA.stores).some(s => DATA.stores[s]?.['2026']?.[4]);

        // Per-store YTD
        const ytdStoreRows = stores2026.map(name => {
          const d2026 = DATA.stores[name]?.['2026'] || {};
          const hStore = HISTORICAL[name];

          // 2026 YTD
          let fat2026ytd = 0;
          ytdMonthsFull.forEach(m => { if (d2026[m]) fat2026ytd += d2026[m].valor; });
          if (d2026[4]) fat2026ytd += d2026[4].valor; // April partial (actual data)

          // 2025 YTD
          let fat2025ytd = null;
          if (hStore && hStore['2025']) {
            const h25 = hStore['2025'];
            let hasAll = true;
            let fat = 0;
            ytdMonthsFull.forEach(m => {
              if (h25[String(m)]) fat += h25[String(m)].valor;
              else hasAll = false;
            });
            if (hasAll) {
              // Add April 1 2025 estimate: full April 2025 / 30
              if (h25['4']) {
                fat += h25['4'].valor / 30;
              }
              fat2025ytd = fat;
            }
          }

          const varYTD = (fat2025ytd && fat2026ytd) ? ((fat2026ytd / fat2025ytd) - 1) * 100 : null;
          return { name, fat2026ytd, fat2025ytd, varYTD };
        });

        // Consolidated chart data for YTD
        const buildYTDChartData = (storeFilter) => {
          let relevantStores;
          if (storeFilter === '__consolidated__') {
            relevantStores = ytdStoreRows;
          } else if (!storeFilter) {
            // Same stores present in all 4 years
            relevantStores = ytdStoreRows.filter(s => {
              const row = allYearsStores.find(r => r.name === s.name);
              return !!row;
            });
          } else {
            relevantStores = ytdStoreRows.filter(s => s.name === storeFilter);
          }

          const fat2025ytd = relevantStores.reduce((sum, s) => sum + (s.fat2025ytd || 0), 0);
          const fat2026ytd = relevantStores.reduce((sum, s) => sum + s.fat2026ytd, 0);
          return { fat2025ytd, fat2026ytd };
        };

        return { ytdStoreRows, buildYTDChartData };
      })();

      // ============================================================================
      // MOM MTD DATA (April month-to-date)
      // ============================================================================
      const computeMTD = (() => {
        // April 2026 MTD = DATA month 4 value (actual Apr 1)
        // April 2025 MTD = HISTORICAL April 2025 full / 30 (estimate for 1 day)
        const mtdStoreRows = stores2026.map(name => {
          const d2026 = DATA.stores[name]?.['2026'] || {};
          const hStore = HISTORICAL[name];

          const fatAbr26 = d2026[4] ? d2026[4].valor : 0;
          let fatAbr25 = null;
          if (hStore && hStore['2025'] && hStore['2025']['4']) {
            fatAbr25 = hStore['2025']['4'].valor / 30; // 1 day estimate
          }
          const varAbr = (fatAbr25 && fatAbr26) ? ((fatAbr26 / fatAbr25) - 1) * 100 : null;
          return { name, fatAbr26, fatAbr25, varAbr };
        });

        const buildMTDChartData = (storeFilter) => {
          let relevantStores;
          if (storeFilter === '__consolidated__') {
            relevantStores = mtdStoreRows;
          } else if (!storeFilter) {
            relevantStores = mtdStoreRows.filter(s => {
              return allYearsStores.find(r => r.name === s.name);
            });
          } else {
            relevantStores = mtdStoreRows.filter(s => s.name === storeFilter);
          }

          const fatAbr25 = relevantStores.reduce((sum, s) => sum + (s.fatAbr25 || 0), 0);
          const fatAbr26 = relevantStores.reduce((sum, s) => sum + s.fatAbr26, 0);
          return { fatAbr25, fatAbr26 };
        };

        return { mtdStoreRows, buildMTDChartData };
      })();

      // Merge MTD April data into momStoreRows for sorting
      momStoreRows.forEach(row => {
        const mtd = computeMTD.mtdStoreRows.find(r => r.name === row.name);
        row.fatAbr26 = mtd ? mtd.fatAbr26 : 0;
        row.varAbr = mtd ? mtd.varAbr : null;
      });

return {
        storeRows, comparableStores, totalFat2026, totalFat2025, varTotal,
        consolidatedChart, consolidatedAllChart, allYearsStores, storeChartData, storeNames2026, fatYTD,
        periodLabel, monthRange, hasProjection, partialMonth, daysElapsed, daysInPartial,
        // MoM data
        momStoreRows, momChartAllStores, momChartConsolidated, momChartForStore, momAllYearsCount,
        momFatMar26, momFatMar25, momVarMar, momComparableMarStores, lastMonth,
        MESES_REF: MESES,
        // Summary rows
        yoySummaryAll, yoySummarySame, momSummaryAll, momSummarySame,
        // Daily data
        dailyComputed,
        // YTD/MTD data
        computeYTD, computeMTD,
      };
    }, []);

    const handleSort = (col) => {
      if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setSortCol(col); setSortDir('desc'); }
    };

    const handleMomSort = (col) => {
      if (momSortCol === col) setMomSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setMomSortCol(col); setMomSortDir('desc'); }
    };

    const handleDailySort = (col) => {
      if (dailySortCol === col) setDailySortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setDailySortCol(col); setDailySortDir('desc'); }
    };

    const sortedStores = useMemo(() => {
      return [...computed.storeRows].sort((a, b) => {
        let va, vb;
        if (sortCol === 'name') { va = a.name; vb = b.name; }
        else { va = a[sortCol]; vb = b[sortCol]; }
        if (va === null) va = sortDir === 'asc' ? Infinity : -Infinity;
        if (vb === null) vb = sortDir === 'asc' ? Infinity : -Infinity;
        if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortDir === 'asc' ? va - vb : vb - va;
      });
    }, [computed, sortCol, sortDir]);

    const sortedMomStores = useMemo(() => {
      return [...computed.momStoreRows].sort((a, b) => {
        let va, vb;
        if (momSortCol === 'name') { va = a.name; vb = b.name; }
        else { va = a[momSortCol]; vb = b[momSortCol]; }
        if (va === null) va = momSortDir === 'asc' ? Infinity : -Infinity;
        if (vb === null) vb = momSortDir === 'asc' ? Infinity : -Infinity;
        if (typeof va === 'string') return momSortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return momSortDir === 'asc' ? va - vb : vb - va;
      });
    }, [computed, momSortCol, momSortDir]);

    const SortHeader = ({ col, label, align = 'left' }) => (
      <th className={`px-3 py-2 text-${align} text-xs font-medium text-slate-400 cursor-pointer hover:text-white select-none whitespace-nowrap`} onClick={() => handleSort(col)}>
        {label} {sortCol === col ? (sortDir === 'asc' ? '↑' : '↓') : ''}
      </th>
    );

    const MomSortHeader = ({ col, label, align = 'left' }) => (
      <th className={`px-3 py-2 text-${align} text-xs font-medium text-slate-400 cursor-pointer hover:text-white select-none whitespace-nowrap`} onClick={() => handleMomSort(col)}>
        {label} {momSortCol === col ? (momSortDir === 'asc' ? '↑' : '↓') : ''}
      </th>
    );

    const DailySortHeader = ({ col, label, align = 'left' }) => (
      <th className={`px-3 py-2 text-${align} text-xs font-medium text-slate-400 cursor-pointer hover:text-white select-none whitespace-nowrap`} onClick={() => handleDailySort(col)}>
        {label} {dailySortCol === col ? (dailySortDir === 'asc' ? '↑' : '↓') : ''}
      </th>
    );

    const { periodLabel, hasProjection, partialMonth, daysElapsed, daysInPartial } = computed;

    // Chart data based on store filter (full year bars + YTD bars)
    const chartData = useMemo(() => {
      let base;
      if (chartStore === '__consolidated__') base = computed.consolidatedAllChart;
      else if (!chartStore) base = computed.consolidatedChart;
      else base = computed.storeChartData(chartStore);

      // Append spacer + YTD entries
      const ytd = computed.computeYTD.buildYTDChartData(chartStore || '');
      const ytdEntries = [];
      if (ytd.fat2025ytd > 0 || ytd.fat2026ytd > 0) {
        ytdEntries.push({ ano: '', faturamento: 0, isSpacer: true });
      }
      if (ytd.fat2025ytd > 0) ytdEntries.push({ ano: '2025 YTD', faturamento: ytd.fat2025ytd, isYTD: true });
      if (ytd.fat2026ytd > 0) ytdEntries.push({ ano: '2026 YTD', faturamento: ytd.fat2026ytd, isYTD: true });
      return [...base, ...ytdEntries];
    }, [chartStore, computed]);

    const chartSubtitle = useMemo(() => {
      if (chartStore === '__consolidated__') return `Consolidado — todas as ${computed.storeRows.length} lojas ativas`;
      if (!chartStore) return `Todas as lojas presentes nos 4 anos (${computed.allYearsStores.length} lojas)`;
      return chartStore;
    }, [chartStore, computed]);

    // KPI cards react to filter selection (YoY tab) — use YTD values
    const yoyKPI = useMemo(() => {
      const cd = chartData;
      const fat26ytd = cd.find(d => d.ano === '2026 YTD')?.faturamento || 0;
      const fat25ytd = cd.find(d => d.ano === '2025 YTD')?.faturamento || 0;
      const varYTD = fat25ytd > 0 ? ((fat26ytd / fat25ytd) - 1) * 100 : 0;
      const count = chartStore === '__consolidated__' ? computed.storeRows.length
        : (!chartStore ? computed.allYearsStores.length : 1);
      const total = computed.storeRows.length;
      return { fat26ytd, fat25ytd, varYTD, count, total };
    }, [chartData, chartStore, computed]);

    const momChartData = useMemo(() => {
      let base;
      if (momChartStore === '__consolidated__') base = computed.momChartConsolidated;
      else if (!momChartStore) base = computed.momChartAllStores;
      else base = computed.momChartForStore(momChartStore);

      // Append spacer + MTD bars for April
      const mtd = computed.computeMTD.buildMTDChartData(momChartStore || '');
      if (mtd.fatAbr25 > 0 || mtd.fatAbr26 > 0) {
        base = [...base,
          { month: ' ', '2023': 0, '2024': 0, '2025': 0, '2026': 0, isSpacer: true },
          {
            month: 'Abr MTD',
            '2025': mtd.fatAbr25 || 0,
            '2026': mtd.fatAbr26 || 0,
            isMTD: true,
          }
        ];
      }
      return base;
    }, [momChartStore, computed]);

    const momChartSubtitle = useMemo(() => {
      if (momChartStore === '__consolidated__') return `Consolidado — todas as ${computed.storeRows.length} lojas ativas`;
      if (!momChartStore) return `Todas as lojas presentes nos 4 anos (${computed.momAllYearsCount} lojas)`;
      return momChartStore;
    }, [momChartStore, computed]);

    // KPI cards react to filter selection (MoM tab)
    const momKPI = useMemo(() => {
      const cd = momChartData;
      // Use last full-month entry (not MTD)
      const fullEntries = cd.filter(d => !d.isMTD);
      const lastEntry = fullEntries[fullEntries.length - 1] || {};
      const fat26 = lastEntry['2026'] || 0;
      const fat25 = lastEntry['2025'] || 0;
      const varMoM = fat25 > 0 ? ((fat26 / fat25) - 1) * 100 : 0;
      const monthName = lastEntry.month || '';
      return { fat26, fat25, varMoM, monthName };
    }, [momChartData]);

    // Daily tab computed values
    const dailyChartData = useMemo(() => {
      if (!computed.dailyComputed) return [];
      return computed.dailyComputed.buildChartData(dailyStore);
    }, [dailyStore, computed]);

    const dailyMetrics2025 = useMemo(() => {
      if (!computed.dailyComputed) return {};
      return computed.dailyComputed.computeMetrics(computed.dailyComputed.dates2025, dailyStore);
    }, [dailyStore, computed]);

    const dailyMetrics2026 = useMemo(() => {
      if (!computed.dailyComputed) return {};
      return computed.dailyComputed.computeMetrics(computed.dailyComputed.dates2026, dailyStore);
    }, [dailyStore, computed]);

    const sortedDailyStores = useMemo(() => {
      if (!computed.dailyComputed) return [];
      return [...computed.dailyComputed.storeTableRows].sort((a, b) => {
        let va, vb;
        if (dailySortCol === 'name') { va = a.name; vb = b.name; }
        else { va = a[dailySortCol]; vb = b[dailySortCol]; }
        if (va === null || va === undefined) va = dailySortDir === 'asc' ? Infinity : -Infinity;
        if (vb === null || vb === undefined) vb = dailySortDir === 'asc' ? Infinity : -Infinity;
        if (typeof va === 'string') return dailySortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return dailySortDir === 'asc' ? va - vb : vb - va;
      });
    }, [computed, dailySortCol, dailySortDir]);

    return (
      <div className="min-h-screen bg-slate-900 text-white">
        {/* Header */}
        <div className="bg-slate-800/80 backdrop-blur border-b border-slate-700/50 sticky top-0 z-30">
          <div className="max-w-7xl mx-auto px-4 py-3">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-white">🏪 Sanca 2026</h1>
                <p className="text-slate-400 text-xs sm:text-sm">Dashboard Operacional • Atualizado: {DATA.lastUpdate}</p>
              </div>
              
            </div>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">
          {/* Projection banner removed */}

          {/* Tab Bar */}
          <div className="flex gap-6 border-b border-slate-700/50">
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'yoy' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('yoy')}
            >
              Comparativo Anual
            </button>
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'mom' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('mom')}
            >
              Comparativo Mensal
            </button>
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'daily' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('daily')}
            >
              Comparativo Diário
            </button>
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'trends' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('trends')}
            >
              Tendências
            </button>
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'clients' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('clients')}
            >
              Clientes
            </button>
          </div>

          {/* ============ YoY TAB ============ */}
          {activeTab === 'yoy' && (
            <React.Fragment>
              {/* KPI Cards */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                <MetricCard
                  title="Fat. YTD 2026"
                  value={formatK(yoyKPI.fat26ytd)}
                  icon="📊"
                  color="green"
                />
                <MetricCard
                  title="Fat. YTD 2025"
                  value={formatK(yoyKPI.fat25ytd)}
                  subtitle={chartSubtitle}
                  icon="📊"
                  color="purple"
                />
                <MetricCard
                  title="Variação YTD"
                  value={`${yoyKPI.varYTD >= 0 ? '+' : ''}${yoyKPI.varYTD.toFixed(1)}%`}
                  icon={yoyKPI.varYTD >= 0 ? "📈" : "📉"}
                  color={yoyKPI.varYTD >= 0 ? "green" : "amber"}
                />
                <MetricCard
                  title="Lojas"
                  value={yoyKPI.count}
                  subtitle={`de ${yoyKPI.total} ativas`}
                  icon="🏬"
                  color="blue"
                />
              </div>

              {/* Consolidated bar chart with store filter */}
              <Card>

                </Card>
                <Card>
                  <p className="text-slate-400 text-xs mb-1">Receita (Cashless)</p>
                  <p className="text-white text-2xl font-bold">{formatR$(m26?.totalValor || 0)}</p>
                  <p className="text-xs text-slate-500 mt-1">(dados VMPay transacional)</p>
                  <p className={`text-sm mt-0.5 ${varColor(pctVar(m25?.totalValor, m26?.totalValor))}`}>
                    {varStr(pctVar(m25?.totalValor, m26?.totalValor))}
                  </p>
                </Card>
                <Card>
                  <p className="text-slate-400 text-xs mb-1">Pareto (Top 20%)</p>
                  <p className="text-white text-2xl font-bold">{(m26?.paretoRatio || 0).toFixed(1)}%</p>
                  <p className="text-sm text-slate-500 mt-1">2025: {(m25?.paretoRatio || 0).toFixed(1)}%</p>
                </Card>
              </div>
              
              {/* Frequency Distribution */}
              <Card>
                <h3 className="text-lg font-semibold text-white mb-4">Distribuição de Frequência de Compra</h3>
                <ResponsiveContainer width="100%" height={300}>
                  <BarChart data={freqChart}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                    <XAxis dataKey="bucket" stroke="#94a3b8" label={{value: 'Transações por cliente', position: 'insideBottom', offset: -5, fill: '#94a3b8'}} />
                    <YAxis stroke="#94a3b8" label={{value: 'Nº clientes', angle: -90, position: 'insideLeft', fill: '#94a3b8'}} />
                    <Tooltip contentStyle={{backgroundColor:'#1e293b',border:'1px solid #334155',borderRadius:'8px'}} />
                    <Bar dataKey="count2025" fill="#8b5cf6" name="2025" />
                    <Bar dataKey="count2026" fill="#22c55e" name="2026" />
                    <Legend />
                  </BarChart>
                </ResponsiveContainer>
              </Card>
              
              {/* Top 20 Clients - Horizontal Bar Chart */}
              <Card>
                <h3 className="text-lg font-semibold text-white mb-4">Top 20 Clientes por Valor — 2026</h3>
                {(() => {
                  const top20Data = (cd.top202026 || []).slice(0, 20).map((c, i) => ({
                    name: c.card,
                    valor: c.valor,
                    tx: c.tx,
                  })).reverse();
                  return (
                    <ResponsiveContainer width="100%" height={Math.max(400, top20Data.length * 28)}>
                      <BarChart data={top20Data} layout="vertical" margin={{left: 100, right: 30, top: 5, bottom: 5}}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                        <XAxis type="number" stroke="#94a3b8" tickFormatter={v => `R$${(v/1000).toFixed(1)}k`} />
                        <YAxis type="category" dataKey="name" stroke="#94a3b8" tick={{fontSize: 11, fontFamily: 'monospace'}} width={100} />
                        <Tooltip contentStyle={{backgroundColor:'#1e293b',border:'1px solid #334155',borderRadius:'8px'}} formatter={(v, n) => [formatR$(v), 'Valor']} labelFormatter={l => `Cartão: ${l}`} />
                        <Bar dataKey="valor" fill="#22c55e" radius={[0, 4, 4, 0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  );
                })()}
              </Card>
              
              {/* Per-Store Metrics Table (only for consolidated views) */}
              {(storeKey === '__all__' || storeKey === '__same__') && cd.stores2026 && (
              <Card>
                <h3 className="text-lg font-semibold text-white mb-4">Concentração por Loja — 2026 YTD</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-slate-700">
                        <th className="px-3 py-2 text-left text-xs font-medium text-slate-400">Loja</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Clientes 25</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Clientes 26</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Var %</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Tx/Cli 25</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Tx/Cli 26</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Pareto 25</th>
                        <th className="px-3 py-2 text-right text-xs font-medium text-slate-400">Pareto 26</th>
                      </tr>
                    </thead>
                    <tbody>
                      {cd.stores2026.map((s26, i) => {
                        const s25 = cd.stores2025?.find(x => x.store === s26.store);
                        const clientVar = pctVar(s25?.uniqueClients, s26.uniqueClients);
                        return (
                          <tr key={i} className={`border-b border-slate-700/50 ${i % 2 === 0 ? 'bg-slate-800/30' : ''}`}>
                            <td className="px-3 py-2 text-white">{s26.store}</td>
                            <td className="px-3 py-2 text-slate-400 text-right">{s25?.uniqueClients?.toLocaleString('pt-BR') ?? '—'}</td>
                            <td className="px-3 py-2 text-white text-right">{s26.uniqueClients.toLocaleString('pt-BR')}</td>
                            <td className={`px-3 py-2 text-right font-medium ${varColor(clientVar)}`}>{varStr(clientVar)}</td>
                            <td className="px-3 py-2 text-slate-400 text-right">{s25?.txPerClient?.toFixed(1) ?? '—'}</td>
                            <td className="px-3 py-2 text-white text-right">{s26.txPerClient.toFixed(1)}</td>
                            <td className="px-3 py-2 text-slate-400 text-right">{s25?.paretoRatio?.toFixed(1) ?? '—'}%</td>
                            <td className="px-3 py-2 text-white text-right">{s26.paretoRatio.toFixed(1)}%</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </Card>
              )}
            </React.Fragment>
            );
          })()}

        </div>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
