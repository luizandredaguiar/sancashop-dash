  <script type="text/babel">
  const { useState, useMemo } = React;
  const {
    BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
    ResponsiveContainer, Cell
  } = Recharts;

  const DATA = window.DATA;
  const HISTORICAL = window.HISTORICAL;
  const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const CORES = {
    primary: '#6366f1', secondary: '#22c55e', tertiary: '#f59e0b',
    danger: '#ef4444', neutral: '#64748b', purple: '#8b5cf6',
    blue: '#3b82f6', pink: '#ec4899', cyan: '#06b6d4', orange: '#f97316'
  };

  const formatR$ = (v) => `R$ ${Number(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
  const formatK = (v) => v >= 1000 ? `R$ ${(v/1000).toFixed(0)}k` : formatR$(v);
  const formatM = (v) => `R$ ${(v/1000000).toFixed(2)}M`;

  // ============================================================================
  // COMPONENTS
  // ============================================================================
  const Card = ({ children, className = "" }) => (
    <div className={`bg-slate-800/50 backdrop-blur border border-slate-700/50 rounded-xl p-4 ${className}`}>
      {children}
    </div>
  );

  const MetricCard = ({ title, value, subtitle, icon, color = 'indigo' }) => {
    const colors = { indigo: 'bg-indigo-500/20 text-indigo-400', green: 'bg-green-500/20 text-green-400', amber: 'bg-amber-500/20 text-amber-400', blue: 'bg-blue-500/20 text-blue-400', purple: 'bg-purple-500/20 text-purple-400' };
    return (
      <Card>
        <div className="flex items-start justify-between">
          <div className="min-w-0">
            <p className="text-slate-400 text-xs sm:text-sm mb-1 truncate">{title}</p>
            <p className="text-lg sm:text-2xl font-bold text-white truncate">{value}</p>
            {subtitle && <p className="text-slate-500 text-xs mt-1 truncate">{subtitle}</p>}
          </div>
          <div className={`p-2 rounded-lg flex-shrink-0 ${colors[color] || colors.indigo}`}>
            <span className="text-lg">{icon}</span>
          </div>
        </div>
      </Card>
    );
  };

  const CustomTooltip = ({ active, payload, label }) => {
    if (!active || !payload?.length) return null;
    return (
      <div className="bg-slate-800 border border-slate-600 rounded-lg p-3 shadow-xl text-sm">
        <p className="text-slate-300 font-medium mb-2">{label}</p>
        {payload.map((entry, i) => (
          <p key={i} style={{ color: entry.color }}>
            {entry.name}: {entry.name.includes('Ticket') ? `R$ ${Number(entry.value).toFixed(2)}` : entry.name.includes('aturamento') ? formatR$(entry.value) : entry.value?.toLocaleString('pt-BR')}
          </p>
        ))}
      </div>
    );
  };

  // ============================================================================
  // MAIN APP
  // ============================================================================
  const App = () => {
    const [sortCol, setSortCol] = useState('fat2026');
    const [sortDir, setSortDir] = useState('desc');
    const [chartStore, setChartStore] = useState('');
    const [activeTab, setActiveTab] = useState('yoy');
    const [momChartStore, setMomChartStore] = useState('');
    const [momSortCol, setMomSortCol] = useState('fatMar26');
    const [momSortDir, setMomSortDir] = useState('desc');

    const YEAR_COLORS = { 2023: '#64748b', 2024: '#3b82f6', 2025: '#8b5cf6', 2026: '#22c55e' };

    const computed = useMemo(() => {
      const lastUpdate = DATA.lastUpdate;
      const lastUpdateDate = new Date(lastUpdate + 'T12:00:00');
      const lastUpdateMonth = lastUpdateDate.getMonth() + 1;
      const lastUpdateDay = lastUpdateDate.getDate();
      const months2026 = Object.keys(DATA.stores[Object.keys(DATA.stores)[0]]?.['2026'] || {}).map(Number);
      const maxMonth2026 = Math.max(...months2026);

      const DAYS_IN_MONTH = { 1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30, 7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31 };

      const monthRange = [];
      for (let m = 1; m <= maxMonth2026; m++) monthRange.push(m);

      const partialMonth = (lastUpdateMonth === maxMonth2026) ? maxMonth2026 : null;
      const daysElapsed = partialMonth ? lastUpdateDay : null;
      const daysInPartial = partialMonth ? DAYS_IN_MONTH[partialMonth] : null;
      const projectionFactor = partialMonth ? (daysInPartial / daysElapsed) : 1;

      const periodLabel = monthRange.length === 1 ? MESES[monthRange[0]-1] : MESES[monthRange[0]-1] + '-' + MESES[monthRange[monthRange.length-1]-1];
      const hasProjection = partialMonth !== null;

      const stores2026 = Object.keys(DATA.stores).filter(s => s !== 'CD Sancashop');

      const storeRows = stores2026.map(name => {
        const d2026 = DATA.stores[name]?.['2026'] || {};
        let fat2026 = 0, vendas2026 = 0;
        monthRange.forEach(m => {
          if (d2026[m]) {
            if (m === partialMonth) {
              fat2026 += d2026[m].valor * projectionFactor;
              vendas2026 += Math.round(d2026[m].vendas * projectionFactor);
            } else {
              fat2026 += d2026[m].valor;
              vendas2026 += d2026[m].vendas;
            }
          }
        });
        const ticket2026 = vendas2026 > 0 ? fat2026 / vendas2026 : 0;

        const yearData = {};
        [2023, 2024, 2025].forEach(year => {
          const hStore = HISTORICAL[name];
          if (!hStore) { yearData[year] = null; return; }
          const hYear = hStore[String(year)];
          if (!hYear || Object.keys(hYear).length === 0) { yearData[year] = null; return; }

          let fat = 0, vendas = 0, hasAll = true;
          monthRange.forEach(m => {
            const md = hYear[String(m)];
            if (!md) { hasAll = false; }
            else { fat += md.valor; vendas += (md.vendas || 0); }
          });

          if (!hasAll) { yearData[year] = null; }
          else { yearData[year] = { fat, vendas, ticket: vendas > 0 ? fat / vendas : null }; }
        });

        const fat2025 = yearData[2025]?.fat || null;
        const vendas2025 = yearData[2025]?.vendas || null;
        const varFatYoY = (fat2025 && fat2026) ? ((fat2026 / fat2025) - 1) * 100 : null;
        const varTicketYoY = (yearData[2025]?.ticket && ticket2026) ? ((ticket2026 / yearData[2025].ticket) - 1) * 100 : null;
        const varVendasYoY = (vendas2025 && vendas2026) ? ((vendas2026 / vendas2025) - 1) * 100 : null;

        return {
          name, fat2026, vendas2026, ticket2026,
          fat2023: yearData[2023]?.fat || null,
          fat2024: yearData[2024]?.fat || null,
          fat2025,
          vendas2025,
          ticket2025: yearData[2025]?.ticket || null,
          varYoY: varFatYoY, varTicketYoY, varVendasYoY,
          existsIn: {
            2023: yearData[2023] !== null,
            2024: yearData[2024] !== null,
            2025: yearData[2025] !== null,
          }
        };
      });

      const comparableStores = storeRows.filter(s => s.fat2025 !== null && s.fat2026 > 0);
      const totalFat2026 = comparableStores.reduce((s, r) => s + r.fat2026, 0);
      const totalFat2025 = comparableStores.reduce((s, r) => s + r.fat2025, 0);
      const varTotal = totalFat2025 > 0 ? ((totalFat2026 / totalFat2025) - 1) * 100 : 0;

      const allYearsStores = storeRows.filter(s => s.existsIn[2023] && s.existsIn[2024] && s.existsIn[2025] && s.fat2026 > 0);
      const consolidatedChart = [2023, 2024, 2025, 2026].map(year => {
        const total = allYearsStores.reduce((sum, s) => {
          if (year === 2026) return sum + s.fat2026;
          return sum + (s['fat' + year] || 0);
        }, 0);
        return { ano: String(year), faturamento: total };
      });

      // Consolidated chart: ALL stores that existed in EACH period (including closed ones)
      const consolidatedAllChart = [2023, 2024, 2025, 2026].map(year => {
        let total = 0;
        if (year === 2026) {
          // Sum all active 2026 stores
          total = storeRows.reduce((sum, s) => sum + s.fat2026, 0);
        } else {
          // Sum ALL stores from HISTORICAL that had data in this year for these months
          const allHistStores = Object.keys(HISTORICAL);
          allHistStores.forEach(name => {
            const hYear = HISTORICAL[name]?.[String(year)];
            if (!hYear) return;
            let hasAll = true, fat = 0;
            monthRange.forEach(m => {
              const md = hYear[String(m)];
              if (!md) { hasAll = false; }
              else { fat += md.valor; }
            });
            if (hasAll) total += fat;
          });
        }
        return { ano: String(year), faturamento: total };
      });

      // Per-store chart data for the dropdown filter
      const storeChartData = (storeName) => {
        const row = storeRows.find(s => s.name === storeName);
        if (!row) return [];
        const result = [];
        [2023, 2024, 2025, 2026].forEach(year => {
          const fat = year === 2026 ? row.fat2026 : row['fat' + year];
          if (fat !== null && fat > 0) result.push({ ano: String(year), faturamento: fat });
        });
        return result;
      };

      // Sorted store names for dropdown
      const storeNames2026 = stores2026.slice().sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // Fat YTD for header
      const fatYTD = Object.keys(DATA.stores).filter(s => s !== 'CD Sancashop').reduce((sum, name) => {
        const yearData = DATA.stores[name]?.['2026'] || {};
        return sum + Object.values(yearData).reduce((s, d) => s + d.valor, 0);
      }, 0);

      // ============================================================================
      // MOM DATA
      // ============================================================================
      const DAYS_IN_MONTH_MAP = DAYS_IN_MONTH;
      const momMonths = monthRange; // same months as YoY (1,2,3)

      const momStoreRows = stores2026.map(name => {
        const d2026 = DATA.stores[name]?.['2026'] || {};
        const hStore = HISTORICAL[name];

        const monthData = {};
        let totalFat26 = 0, totalVendas26 = 0;

        momMonths.forEach(m => {
          const raw2026 = d2026[m];
          if (!raw2026) { monthData[m] = { fat26: 0, fat25: null, fat24: null, fat23: null, var2526: null }; return; }

          let fat26 = raw2026.valor;
          let vendas26 = raw2026.vendas;
          if (m === partialMonth) {
            fat26 = raw2026.valor * projectionFactor;
            vendas26 = Math.round(raw2026.vendas * projectionFactor);
          }

          totalFat26 += fat26;
          totalVendas26 += vendas26;

          const getFat = (year) => {
            if (!hStore || !hStore[String(year)] || !hStore[String(year)][String(m)]) return null;
            return hStore[String(year)][String(m)].valor;
          };

          const fat25 = getFat(2025);
          const fat24 = getFat(2024);
          const fat23 = getFat(2023);
          const var2526 = fat25 ? ((fat26 / fat25) - 1) * 100 : null;

          monthData[m] = { fat26, fat25, fat24, fat23, var2526, vendas26 };
        });

        // Ticket 2026 average across months
        const ticket26 = totalVendas26 > 0 ? totalFat26 / totalVendas26 : 0;

        // Ticket 2025 average (same months)
        let totalFat25ForTicket = 0, totalVendas25ForTicket = 0;
        momMonths.forEach(m => {
          if (hStore && hStore['2025'] && hStore['2025'][String(m)]) {
            const md = hStore['2025'][String(m)];
            totalFat25ForTicket += md.valor;
            totalVendas25ForTicket += (md.vendas || 0);
          }
        });
        const ticket25 = totalVendas25ForTicket > 0 ? totalFat25ForTicket / totalVendas25ForTicket : null;
        const varTicket2526 = (ticket25 && ticket26) ? ((ticket26 / ticket25) - 1) * 100 : null;

        // Total vendas 2025 for same months
        let totalVendas25 = 0;
        let hasAllVendas25 = true;
        momMonths.forEach(m => {
          if (hStore && hStore['2025'] && hStore['2025'][String(m)] && hStore['2025'][String(m)].vendas) {
            totalVendas25 += hStore['2025'][String(m)].vendas;
          } else {
            hasAllVendas25 = false;
          }
        });
        const varVendas2526 = (hasAllVendas25 && totalVendas25 > 0 && totalVendas26 > 0)
          ? ((totalVendas26 / totalVendas25) - 1) * 100 : null;

        return {
          name,
          monthData,
          ticket26,
          ticket25,
          varTicket2526,
          vendas26: totalVendas26,
          varVendas2526,
          // Sortable fields
          fatJan26: monthData[1]?.fat26 || 0,
          fatFev26: monthData[2]?.fat26 || 0,
          fatMar26: monthData[3]?.fat26 || 0,
          varJan: monthData[1]?.var2526,
          varFev: monthData[2]?.var2526,
          varMar: monthData[3]?.var2526,
        };
      });

      // MoM grouped bar chart data
      const momChartAllStores = (() => {
        // Stores present in all 4 years for each month
        const storesInAllYears = stores2026.filter(name => {
          const hStore = HISTORICAL[name];
          if (!hStore) return false;
          return momMonths.every(m => {
            const has23 = hStore['2023'] && hStore['2023'][String(m)] && hStore['2023'][String(m)].valor;
            const has24 = hStore['2024'] && hStore['2024'][String(m)] && hStore['2024'][String(m)].valor;
            const has25 = hStore['2025'] && hStore['2025'][String(m)] && hStore['2025'][String(m)].valor;
            const has26 = DATA.stores[name]?.['2026']?.[m];
            return has23 && has24 && has25 && has26;
          });
        });

        return momMonths.map(m => {
          const entry = { month: MESES[m - 1] };
          [2023, 2024, 2025].forEach(year => {
            entry[String(year)] = storesInAllYears.reduce((sum, name) => {
              const hStore = HISTORICAL[name];
              return sum + (hStore?.[String(year)]?.[String(m)]?.valor || 0);
            }, 0);
          });
          // 2026
          entry['2026'] = storesInAllYears.reduce((sum, name) => {
            const raw = DATA.stores[name]?.['2026']?.[m];
            if (!raw) return sum;
            return sum + (m === partialMonth ? raw.valor * projectionFactor : raw.valor);
          }, 0);
          return entry;
        });
      })();

      // MoM consolidated: ALL stores that existed in EACH period (including closed ones)
      const allHistStoreNames = Object.keys(HISTORICAL);
      const momChartConsolidated = momMonths.map(m => {
        const entry = { month: MESES[m - 1] };
        [2023, 2024, 2025].forEach(year => {
          entry[String(year)] = allHistStoreNames.reduce((sum, name) => {
            return sum + (HISTORICAL[name]?.[String(year)]?.[String(m)]?.valor || 0);
          }, 0);
        });
        entry['2026'] = stores2026.reduce((sum, name) => {
          const raw = DATA.stores[name]?.['2026']?.[m];
          if (!raw) return sum;
          return sum + (m === partialMonth ? raw.valor * projectionFactor : raw.valor);
        }, 0);
        return entry;
      });

      const momChartForStore = (storeName) => {
        const hStore = HISTORICAL[storeName];
        if (!hStore) return [];
        return momMonths.map(m => {
          const entry = { month: MESES[m - 1] };
          [2023, 2024, 2025].forEach(year => {
            entry[String(year)] = hStore?.[String(year)]?.[String(m)]?.valor || 0;
          });
          const raw = DATA.stores[storeName]?.['2026']?.[m];
          entry['2026'] = raw ? (m === partialMonth ? raw.valor * projectionFactor : raw.valor) : 0;
          return entry;
        });
      };

      // Count stores present in all years for the "Todas" filter label
      const momAllYearsCount = stores2026.filter(name => {
        const hStore = HISTORICAL[name];
        if (!hStore) return false;
        return momMonths.every(m => {
          return hStore['2023']?.[String(m)]?.valor &&
                 hStore['2024']?.[String(m)]?.valor &&
                 hStore['2025']?.[String(m)]?.valor &&
                 DATA.stores[name]?.['2026']?.[m];
        });
      }).length;

      // MoM KPI cards - March comparable stores
      const lastMonth = momMonths[momMonths.length - 1]; // 3 = March
      const momComparableMarStores = stores2026.filter(name => {
        const hStore = HISTORICAL[name];
        const has25 = hStore?.['2025']?.[String(lastMonth)]?.valor;
        const has26 = DATA.stores[name]?.['2026']?.[lastMonth];
        return has25 && has26;
      });
      const momFatMar26 = momComparableMarStores.reduce((sum, name) => {
        const raw = DATA.stores[name]?.['2026']?.[lastMonth];
        return sum + (raw ? (lastMonth === partialMonth ? raw.valor * projectionFactor : raw.valor) : 0);
      }, 0);
      const momFatMar25 = momComparableMarStores.reduce((sum, name) => {
        return sum + (HISTORICAL[name]?.['2025']?.[String(lastMonth)]?.valor || 0);
      }, 0);
      const momVarMar = momFatMar25 > 0 ? ((momFatMar26 / momFatMar25) - 1) * 100 : 0;

      return {
        storeRows, comparableStores, totalFat2026, totalFat2025, varTotal,
        consolidatedChart, consolidatedAllChart, allYearsStores, storeChartData, storeNames2026, fatYTD,
        periodLabel, monthRange, hasProjection, partialMonth, daysElapsed, daysInPartial,
        // MoM data
        momStoreRows, momChartAllStores, momChartConsolidated, momChartForStore, momAllYearsCount,
        momFatMar26, momFatMar25, momVarMar, momComparableMarStores, lastMonth,
        MESES_REF: MESES
      };
    }, []);

    const handleSort = (col) => {
      if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setSortCol(col); setSortDir('desc'); }
    };

    const handleMomSort = (col) => {
      if (momSortCol === col) setMomSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setMomSortCol(col); setMomSortDir('desc'); }
    };

    const sortedStores = useMemo(() => {
      return [...computed.storeRows].sort((a, b) => {
        let va, vb;
        if (sortCol === 'name') { va = a.name; vb = b.name; }
        else { va = a[sortCol]; vb = b[sortCol]; }
        if (va === null) va = sortDir === 'asc' ? Infinity : -Infinity;
        if (vb === null) vb = sortDir === 'asc' ? Infinity : -Infinity;
        if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortDir === 'asc' ? va - vb : vb - va;
      });
    }, [computed, sortCol, sortDir]);

    const sortedMomStores = useMemo(() => {
      return [...computed.momStoreRows].sort((a, b) => {
        let va, vb;
        if (momSortCol === 'name') { va = a.name; vb = b.name; }
        else { va = a[momSortCol]; vb = b[momSortCol]; }
        if (va === null) va = momSortDir === 'asc' ? Infinity : -Infinity;
        if (vb === null) vb = momSortDir === 'asc' ? Infinity : -Infinity;
        if (typeof va === 'string') return momSortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return momSortDir === 'asc' ? va - vb : vb - va;
      });
    }, [computed, momSortCol, momSortDir]);

    const SortHeader = ({ col, label, align = 'left' }) => (
      <th className={`px-3 py-2 text-${align} text-xs font-medium text-slate-400 cursor-pointer hover:text-white select-none whitespace-nowrap`} onClick={() => handleSort(col)}>
        {label} {sortCol === col ? (sortDir === 'asc' ? '↑' : '↓') : ''}
      </th>
    );

    const MomSortHeader = ({ col, label, align = 'left' }) => (
      <th className={`px-3 py-2 text-${align} text-xs font-medium text-slate-400 cursor-pointer hover:text-white select-none whitespace-nowrap`} onClick={() => handleMomSort(col)}>
        {label} {momSortCol === col ? (momSortDir === 'asc' ? '↑' : '↓') : ''}
      </th>
    );

    const { periodLabel, hasProjection, partialMonth, daysElapsed, daysInPartial } = computed;

    // Chart data based on store filter
    const chartData = useMemo(() => {
      if (chartStore === '__consolidated__') return computed.consolidatedAllChart;
      if (!chartStore) return computed.consolidatedChart;
      return computed.storeChartData(chartStore);
    }, [chartStore, computed]);

    const chartSubtitle = useMemo(() => {
      if (chartStore === '__consolidated__') return `Consolidado — todas as ${computed.storeRows.length} lojas ativas`;
      if (!chartStore) return `Todas as lojas presentes nos 4 anos (${computed.allYearsStores.length} lojas)`;
      return chartStore;
    }, [chartStore, computed]);

    const momChartData = useMemo(() => {
      if (momChartStore === '__consolidated__') return computed.momChartConsolidated;
      if (!momChartStore) return computed.momChartAllStores;
      return computed.momChartForStore(momChartStore);
    }, [momChartStore, computed]);

    const momChartSubtitle = useMemo(() => {
      if (momChartStore === '__consolidated__') return `Consolidado — todas as ${computed.storeRows.length} lojas ativas`;
      if (!momChartStore) return `Todas as lojas presentes nos 4 anos (${computed.momAllYearsCount} lojas)`;
      return momChartStore;
    }, [momChartStore, computed]);

    return (
      <div className="min-h-screen bg-slate-900 text-white">
        {/* Header */}
        <div className="bg-slate-800/80 backdrop-blur border-b border-slate-700/50 sticky top-0 z-30">
          <div className="max-w-7xl mx-auto px-4 py-3">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-white">🏪 SancaShop 2026</h1>
                <p className="text-slate-400 text-xs sm:text-sm">Dashboard Operacional • Atualizado: {DATA.lastUpdate}</p>
              </div>
              <div className="text-right hidden sm:block">
                <p className="text-indigo-400 text-lg font-bold">{formatM(computed.fatYTD)}</p>
                <p className="text-slate-400 text-xs">Faturamento YTD</p>
              </div>
            </div>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">
          {/* Projection banner */}
          {hasProjection && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl px-4 py-3 flex items-center gap-3">
              <span className="text-amber-400 text-lg">⚠️</span>
              <p className="text-amber-300 text-sm">
                <strong>{MESES[partialMonth-1]} 2026 projetado:</strong> dados reais de {daysElapsed} dias, projetado linearmente para {daysInPartial} dias.
                Valores de 2026 incluem projeção para o mês corrente.
              </p>
            </div>
          )}

          {/* Tab Bar */}
          <div className="flex gap-6 border-b border-slate-700/50">
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'yoy' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('yoy')}
            >
              Comparativo Anual
            </button>
            <button
              className={`pb-3 px-1 text-sm transition-colors ${activeTab === 'mom' ? 'tab-active' : 'tab-inactive'}`}
              onClick={() => setActiveTab('mom')}
            >
              Comparativo Mensal
            </button>
          </div>

          {/* ============ YoY TAB ============ */}
          {activeTab === 'yoy' && (
            <React.Fragment>
              {/* KPI Cards */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                <MetricCard
                  title={`Fat. ${periodLabel} 2026${hasProjection ? '*' : ''}`}
                  value={formatK(computed.totalFat2026)}
                  icon="📊"
                  color="green"
                />
                <MetricCard
                  title={`Fat. ${periodLabel} 2025`}
                  value={formatK(computed.totalFat2025)}
                  subtitle="(mesmas lojas)"
                  icon="📊"
                  color="purple"
                />
                <MetricCard
                  title="Variação YoY"
                  value={`${computed.varTotal >= 0 ? '+' : ''}${computed.varTotal.toFixed(1)}%`}
                  icon={computed.varTotal >= 0 ? "📈" : "📉"}
                  color={computed.varTotal >= 0 ? "green" : "amber"}
                />
                <MetricCard
                  title="Lojas comparáveis"
                  value={computed.comparableStores.length}
                  subtitle={`de ${computed.storeRows.length} ativas`}
                  icon="🏬"
                  color="blue"
                />
              </div>

              {/* Consolidated bar chart with store filter */}
              <Card>
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                  <div>
                    <h3 className="text-lg font-semibold text-white">Faturamento {periodLabel} por Ano</h3>
                    <p className="text-slate-400 text-xs mt-1">{chartSubtitle}</p>
                  </div>
                  <select value={chartStore} onChange={e => setChartStore(e.target.value)}
                    className="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm w-full sm:w-auto sm:min-w-[260px]">
                    <option value="">Mesmas lojas (presentes em todos os anos)</option>
                    <option value="__consolidated__">Consolidado (todas as lojas)</option>
                    {computed.storeNames2026.map(name => <option key={name} value={name}>{name}</option>)}
                  </select>
                </div>
                {chartData.length > 0 ? (
                  <ResponsiveContainer width="100%" height={300}>
                    <BarChart data={chartData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                      <XAxis dataKey="ano" stroke="#94a3b8" />
                      <YAxis stroke="#94a3b8" tickFormatter={v => `R${(v/1000).toFixed(0)}k`} />
                      <Tooltip content={<CustomTooltip />} />
                      <Bar dataKey="faturamento" name="Faturamento" radius={[4, 4, 0, 0]}>
                        {chartData.map((entry, i) => (
                          <Cell key={i} fill={YEAR_COLORS[parseInt(entry.ano)]} />
                        ))}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                ) : (
                  <p className="text-slate-500 text-center py-8">Sem dados disponíveis</p>
                )}
              </Card>

              {/* Store comparison table */}
              <Card>
                <h3 className="text-lg font-semibold text-white mb-4">Comparativo por Loja — {periodLabel}</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-slate-700">
                        <SortHeader col="name" label="Loja" />
                        <SortHeader col="fat2023" label={`Fat ${periodLabel} 23`} align="right" />
                        <SortHeader col="fat2024" label={`Fat ${periodLabel} 24`} align="right" />
                        <SortHeader col="fat2025" label={`Fat ${periodLabel} 25`} align="right" />
                        <SortHeader col="fat2026" label={`Fat ${periodLabel} 26${hasProjection ? '*' : ''}`} align="right" />
                        <SortHeader col="varYoY" label="Var Fat 25→26" align="right" />
                        <SortHeader col="ticket2026" label="Ticket 26" align="right" />
                        <SortHeader col="varTicketYoY" label="Var 25→26" align="right" />
                        <SortHeader col="vendas2026" label="Vendas 26" align="right" />
                        <SortHeader col="varVendasYoY" label="Var 25→26" align="right" />
                      </tr>
                    </thead>
                    <tbody>
                      {sortedStores.map((s, i) => (
                        <tr key={s.name} className={`border-b border-slate-700/50 ${i % 2 === 0 ? 'bg-slate-800/30' : ''}`}>
                          <td className="px-3 py-2 text-white font-medium whitespace-nowrap">{s.name}</td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{s.fat2023 !== null ? formatR$(s.fat2023) : <span className="text-slate-600">—</span>}</td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{s.fat2024 !== null ? formatR$(s.fat2024) : <span className="text-slate-600">—</span>}</td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{s.fat2025 !== null ? formatR$(s.fat2025) : <span className="text-slate-600">—</span>}</td>
                          <td className="px-3 py-2 text-white font-medium text-right whitespace-nowrap">{formatR$(s.fat2026)}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.varYoY === null ? 'text-slate-600' : s.varYoY >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.varYoY !== null ? `${s.varYoY >= 0 ? '+' : ''}${s.varYoY.toFixed(1)}%` : '—'}
                          </td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">R$ {s.ticket2026.toFixed(2)}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.varTicketYoY === null ? 'text-slate-600' : s.varTicketYoY >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.varTicketYoY !== null ? `${s.varTicketYoY >= 0 ? '+' : ''}${s.varTicketYoY.toFixed(1)}%` : '—'}
                          </td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{s.vendas2026.toLocaleString('pt-BR')}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.varVendasYoY === null ? 'text-slate-600' : s.varVendasYoY >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.varVendasYoY !== null ? `${s.varVendasYoY >= 0 ? '+' : ''}${s.varVendasYoY.toFixed(1)}%` : '—'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </React.Fragment>
          )}

          {/* ============ MoM TAB ============ */}
          {activeTab === 'mom' && (
            <React.Fragment>
              {/* MoM KPI Cards */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                <MetricCard
                  title={`Fat. ${MESES[computed.lastMonth - 1]} 2026${hasProjection ? '*' : ''}`}
                  value={formatK(computed.momFatMar26)}
                  icon="📊"
                  color="green"
                />
                <MetricCard
                  title={`Fat. ${MESES[computed.lastMonth - 1]} 2025`}
                  value={formatK(computed.momFatMar25)}
                  subtitle="(mesmas lojas)"
                  icon="📊"
                  color="purple"
                />
                <MetricCard
                  title={`Var ${MESES[computed.lastMonth - 1]} YoY`}
                  value={`${computed.momVarMar >= 0 ? '+' : ''}${computed.momVarMar.toFixed(1)}%`}
                  icon={computed.momVarMar >= 0 ? "📈" : "📉"}
                  color={computed.momVarMar >= 0 ? "green" : "amber"}
                />
                <MetricCard
                  title="Lojas comparáveis"
                  value={computed.momComparableMarStores.length}
                  subtitle={`para ${MESES[computed.lastMonth - 1]}`}
                  icon="🏬"
                  color="blue"
                />
              </div>

              {/* MoM Grouped Bar Chart */}
              <Card>
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                  <div>
                    <h3 className="text-lg font-semibold text-white">Faturamento Mensal por Ano</h3>
                    <p className="text-slate-400 text-xs mt-1">{momChartSubtitle}</p>
                  </div>
                  <select value={momChartStore} onChange={e => setMomChartStore(e.target.value)}
                    className="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm w-full sm:w-auto sm:min-w-[260px]">
                    <option value="">Mesmas lojas (presentes em todos os anos)</option>
                    <option value="__consolidated__">Consolidado (todas as lojas)</option>
                    {computed.storeNames2026.map(name => <option key={name} value={name}>{name}</option>)}
                  </select>
                </div>
                {momChartData.length > 0 ? (
                  <ResponsiveContainer width="100%" height={300}>
                    <BarChart data={momChartData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                      <XAxis dataKey="month" stroke="#94a3b8" />
                      <YAxis stroke="#94a3b8" tickFormatter={v => `R${(v/1000).toFixed(0)}k`} />
                      <Tooltip content={({ active, payload, label }) => {
                        if (!active || !payload?.length) return null;
                        return (
                          <div className="bg-slate-800 border border-slate-600 rounded-lg p-3 shadow-xl text-sm">
                            <p className="text-slate-300 font-medium mb-2">{label}</p>
                            {payload.map((entry, i) => (
                              <p key={i} style={{ color: entry.color }}>
                                {entry.name}: {formatR$(entry.value)}
                              </p>
                            ))}
                          </div>
                        );
                      }} />
                      <Bar dataKey="2023" name="2023" fill={YEAR_COLORS[2023]} radius={[4, 4, 0, 0]} />
                      <Bar dataKey="2024" name="2024" fill={YEAR_COLORS[2024]} radius={[4, 4, 0, 0]} />
                      <Bar dataKey="2025" name="2025" fill={YEAR_COLORS[2025]} radius={[4, 4, 0, 0]} />
                      <Bar dataKey="2026" name="2026" fill={YEAR_COLORS[2026]} radius={[4, 4, 0, 0]} />
                    </BarChart>
                  </ResponsiveContainer>
                ) : (
                  <p className="text-slate-500 text-center py-8">Sem dados disponíveis</p>
                )}
              </Card>

              {/* MoM Comparison Table */}
              <Card>
                <h3 className="text-lg font-semibold text-white mb-4">Comparativo Mensal por Loja — 2026</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-slate-700">
                        <MomSortHeader col="name" label="Loja" />
                        <MomSortHeader col="fatJan26" label="Fat Jan 26" align="right" />
                        <MomSortHeader col="varJan" label="Var 25→26" align="right" />
                        <MomSortHeader col="fatFev26" label="Fat Fev 26" align="right" />
                        <MomSortHeader col="varFev" label="Var 25→26" align="right" />
                        <MomSortHeader col="fatMar26" label="Fat Mar 26*" align="right" />
                        <MomSortHeader col="varMar" label="Var 25→26" align="right" />

                      </tr>
                    </thead>
                    <tbody>
                      {sortedMomStores.map((s, i) => (
                        <tr key={s.name} className={`border-b border-slate-700/50 ${i % 2 === 0 ? 'bg-slate-800/30' : ''}`}>
                          <td className="px-3 py-2 text-white font-medium whitespace-nowrap">{s.name}</td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{formatR$(s.monthData[1]?.fat26 || 0)}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.monthData[1]?.var2526 === null ? 'text-slate-600' : s.monthData[1]?.var2526 >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.monthData[1]?.var2526 !== null ? `${s.monthData[1].var2526 >= 0 ? '+' : ''}${s.monthData[1].var2526.toFixed(1)}%` : '—'}
                          </td>
                          <td className="px-3 py-2 text-slate-300 text-right whitespace-nowrap">{formatR$(s.monthData[2]?.fat26 || 0)}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.monthData[2]?.var2526 === null ? 'text-slate-600' : s.monthData[2]?.var2526 >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.monthData[2]?.var2526 !== null ? `${s.monthData[2].var2526 >= 0 ? '+' : ''}${s.monthData[2].var2526.toFixed(1)}%` : '—'}
                          </td>
                          <td className="px-3 py-2 text-white font-medium text-right whitespace-nowrap">{formatR$(s.monthData[3]?.fat26 || 0)}</td>
                          <td className={`px-3 py-2 text-right font-medium whitespace-nowrap ${s.monthData[3]?.var2526 === null ? 'text-slate-600' : s.monthData[3]?.var2526 >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                            {s.monthData[3]?.var2526 !== null ? `${s.monthData[3].var2526 >= 0 ? '+' : ''}${s.monthData[3].var2526.toFixed(1)}%` : '—'}
                          </td>

                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </React.Fragment>
          )}
        </div>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
